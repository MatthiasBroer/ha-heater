set_ready_by:
  target:
    entity:
      integration: heater
      domain: climate
  fields:
    time:
      required: true
      example: "07:00:00"
      selector:
        time:
    temperature:
      required: false
      example: 21
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
clear_ready_by:
  target:
    entity:
      integration: heater
      domain: climate
reset_learning:
  target:
    entity:
      integration: heater
      domain: climate
